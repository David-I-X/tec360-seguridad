# ============================================
# Tec360 Seguridad — Production Docker Compose
# ============================================
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# First-time SSL setup:
#   1. Set DOMAIN in .env.production
#   2. Run with nginx listening on port 80 first (for ACME challenge)
#   3. docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d $DOMAIN --email $EMAIL --agree-tos
#   4. Restart: docker compose -f docker-compose.prod.yml restart nginx
# ============================================

services:
  # --- PostgreSQL + PostGIS ---
  db:
    image: kartoza/postgis:15-3.3
    container_name: tec360_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tec360}
      POSTGRES_PASS: ${DB_PASSWORD:?Database password required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_DB: ${DB_NAME:-tec360}
      POSTGRES_DBNAME: ${DB_NAME:-tec360}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-tec360}", "-d", "${DB_NAME:-tec360}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tec360_net

  # --- Backend API (FastAPI) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/david-i-x/tec360-seguridad/backend:latest
    container_name: tec360_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql://${DB_USER:-tec360}:${DB_PASSWORD}@db:5432/${DB_NAME:-tec360}
      - SECRET_KEY=${SECRET_KEY:?Secret key required}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - SKIP_CONFIG_VALIDATION=false
      - TRACCAR_URL=${TRACCAR_URL:-http://10.0.1.56:8082}
      - TRACCAR_USER=${TRACCAR_USER:-admin}
      - TRACCAR_PASSWORD=${TRACCAR_PASSWORD:-admin}
    volumes:
      - uploads_data:/opt/tec360-seguridad/uploads
    networks:
      - tec360_net
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
        - NEXT_PUBLIC_GOOGLE_MAPS_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-AIzaSyCu1NMEsMIIiY1LoOKlzrSovS-r4jTWWFY}
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    image: ghcr.io/david-i-x/tec360-seguridad/frontend:latest
    container_name: tec360_frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/public/app:/app/public/app
    networks:
      - tec360_net
    expose:
      - "3000"

  # --- Nginx Reverse Proxy + SSL ---
  nginx:
    image: nginx:alpine
    container_name: tec360_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - uploads_data:/opt/tec360-seguridad/uploads:ro
    networks:
      - tec360_net

  # --- Certbot (SSL certificate management) ---
  certbot:
    image: certbot/certbot
    container_name: tec360_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Auto-renew: run every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  certbot_www:
  certbot_certs:
  uploads_data:


networks:
  tec360_net:
    driver: bridge
