worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Performance ---
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # --- Security Headers (Default Global) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Rate Limiting Zones ---
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

    # --- Docker DNS Resolver ---
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Upstream Servers ---
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # --- Zero-Cost Proxy Cache Zone (Disk + RAM Keys) ---
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=TEC360_CACHE:10m max_size=1g inactive=60m use_temp_path=off;
    proxy_temp_path /var/cache/nginx_temp;
    proxy_cache_key "$scheme$request_method$host$request_uri$http_rsc";

    # --- Cache Bypass Maps (Strict Session & Private Route Isolation) ---
    # 1. Bypass si existe cabecera Authorization (JWT Bearer token)
    map $http_authorization $auth_bypass {
        default 0;
        "~."    1;
    }

    # 2. Bypass si existen cookies de sesión o autenticación
    map $http_cookie $cookie_bypass {
        default 0;
        "~*(session|token|auth|next-auth|__Secure-|tec360_auth)" 1;
    }

    # 3. Bypass para rutas de paneles privados o flujos de autenticación en Frontend
    map $request_uri $uri_bypass {
        default 0;
        "~*^/(admin|tecnico|taller|servicios|perfil|vehiculos|auth|register|login|cotizaciones|dispositivos)" 1;
    }

    # Combinación final: si cualquiera es 1, no usar ni guardar en caché
    map "$auth_bypass:$cookie_bypass:$uri_bypass" $skip_cache {
        default 1;
        "0:0:0" 0;
    }

    # --- HTTP Server (ACME challenge + redirect) ---
    server {
        listen 80;
        server_name _;

        # Let's Encrypt verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect to HTTPS (only if certs exist)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS Server ---
    server {
        listen 443 ssl;
        server_name _;

        # --- SSL Certificates ---
        ssl_certificate     /etc/letsencrypt/live/tec-360.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tec-360.tech/privkey.pem;

        # --- SSL Security ---
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 10M;

        # --- WebSocket via /api/ws/ path (MUST be before generic /api/ block) ---
        location ^~ /api/ws/ {
            proxy_pass http://backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # --- Public Catalog Microcaching (30s cache for high concurrency during onboarding) ---
        location ~ ^/api/(organizations/public-list|courses)$ {
            limit_req zone=api_general burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache TEC360_CACHE;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 30s;
            proxy_cache_bypass $auth_bypass $cookie_bypass;
            proxy_no_cache $auth_bypass $cookie_bypass;
            proxy_cache_lock on;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # --- Auth endpoints (stricter rate limit, placed before generic /api/) ---
        location ^~ /api/auth/ {
            limit_req zone=api_auth burst=3 nodelay;

            proxy_pass http://backend/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Backend API ---
        location ^~ /api/ {
            limit_req zone=api_general burst=20 nodelay;

            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- WebSocket (tracking) ---
        location ^~ /ws/ {
            proxy_pass http://backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # --- Socket.IO ---
        location ^~ /socket.io/ {
            proxy_pass http://backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # --- Health Check ---
        location = /health {
            proxy_pass http://backend/health;
        }

        # --- Uploaded files (avatars, service photos) — served directly from shared volume with root ---
        location ^~ /uploads/ {
            root /opt/tec360-seguridad;
            expires 1d;
            etag on;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=43200" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # --- Service Worker (must NEVER be cached by browser or proxy) ---
        location = /sw.js {
            proxy_pass http://frontend/sw.js;
            proxy_set_header Host $host;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            expires 0;
        }

        # --- Next.js Static Assets (hashed, immutable) ---
        location ^~ /_next/static/ {
            proxy_pass http://frontend/_next/static/;
            proxy_set_header Host $host;
            proxy_cache TEC360_CACHE;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # --- Public Static Assets (icons, images, fonts) ---
        location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_cache TEC360_CACHE;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # --- Frontend (everything else, landing page with zero-cost microcaching & anti-stampede) ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache TEC360_CACHE;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
