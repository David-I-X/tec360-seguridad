    <text x="88" y="402" font-family="Segoe UI" font-size="15" fill="#B4B0C8">• <tspan font-weight="700" fill="#F8FAFC">Fórmula obligatoria:</tspan> Frase líder en #F8FAFC + continuación en #A39EB8 + foco en #00F0FF entre [CORCHETES].</text>
    <text x="88" y="432" font-family="Segoe UI" font-size="15" fill="#B4B0C8">• <tspan font-weight="700" fill="#F8FAFC">Cero kickers:</tspan> Nunca colocar etiquetas pequeñas ni numeraciones decorativas sobre un titular.</text>
    <text x="88" y="462" font-family="Segoe UI" font-size="15" fill="#B4B0C8">• <tspan font-weight="700" fill="#F8FAFC">No partir corchetes:</tspan> Aplicar siempre whitespace-nowrap al bloque [ENTRE CORCHETES].</text>
