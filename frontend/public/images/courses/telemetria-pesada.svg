<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="heavy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160817" />
      <stop offset="50%" stop-color="#2a0c2c" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <radialGradient id="pink-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <pattern id="heavy-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#500724" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#heavy-bg)" />
  <rect width="800" height="450" fill="url(#heavy-grid)" opacity="0.6" />
  <circle cx="400" cy="205" r="180" fill="url(#pink-glow)" />

  <!-- Truck Silhouette & Heavy Telemetry Graphic -->
  <g transform="translate(400, 195)">
    <!-- Heavy Truck Silhouette Vector -->
    <path d="M -110 35 L -110 -25 L -45 -25 L -20 0 L 40 0 L 40 35 Z" fill="#1e1b4b" stroke="#f43f5e" stroke-width="2.5" filter="drop-shadow(0px 8px 24px rgba(244,63,94,0.4))" />
    
    <!-- Truck Trailer Box -->
    <rect x="-110" y="-45" width="70" height="55" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="2" />
    
    <!-- Wheels -->
    <circle cx="-90" cy="35" r="14" fill="#09090b" stroke="#f43f5e" stroke-width="2.5" />
    <circle cx="-65" cy="35" r="14" fill="#09090b" stroke="#f43f5e" stroke-width="2.5" />
    <circle cx="15" cy="35" r="14" fill="#09090b" stroke="#f43f5e" stroke-width="2.5" />

    <!-- 24V DC Badge -->
    <g transform="translate(70, -35)">
      <rect x="-30" y="-14" width="60" height="28" rx="8" fill="#831843" stroke="#f472b6" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="900">24V DC</text>
    </g>

    <!-- Fuel Sensor Rod Graphic -->
    <g transform="translate(70, 15)">
      <rect x="-5" y="-30" width="10" height="50" rx="3" fill="#be123c" stroke="#f472b6" stroke-width="1.5" />
      <circle cx="0" cy="-30" r="10" fill="#f43f5e" />
      <text x="25" y="-5" fill="#f472b6" font-family="monospace" font-size="10" font-weight="bold">DIÉSEL BLE</text>
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="345" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="1">
    TELEMETRÍA PESADA: QUECLINK &amp; TELTONIKA
  </text>
  <text x="400" y="375" text-anchor="middle" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">
    SISTEMAS 24V • SENSORES DE COMBUSTIBLE • CAN J1939
  </text>
</svg>
