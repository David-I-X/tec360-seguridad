<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)" />
  <rect width="800" height="450" fill="url(#grid)" opacity="0.6" />
  <circle cx="400" cy="210" r="180" fill="url(#glow)" />

  <!-- Technical Circuit Lines -->
  <g stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <path d="M 120 100 L 220 100 L 260 140 L 330 140" />
    <circle cx="120" cy="100" r="3" fill="#10b981" />
    <circle cx="330" cy="140" r="3" fill="#10b981" />

    <path d="M 680 100 L 580 100 L 540 140 L 470 140" />
    <circle cx="680" cy="100" r="3" fill="#10b981" />
    <circle cx="470" cy="140" r="3" fill="#10b981" />

    <path d="M 160 340 L 260 340 L 300 300 L 340 300" />
    <circle cx="160" cy="340" r="3" fill="#10b981" />
    <circle cx="340" cy="300" r="3" fill="#10b981" />

    <path d="M 640 340 L 540 340 L 500 300 L 460 300" />
    <circle cx="640" cy="340" r="3" fill="#10b981" />
    <circle cx="460" cy="300" r="3" fill="#10b981" />
  </g>

  <!-- Central Shield -->
  <g transform="translate(400, 205)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="85" fill="#0f172a" stroke="#10b981" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.8" />
    
    <!-- Shield path -->
    <path d="M 0 -55 L 42 -35 L 42 15 C 42 45 0 65 0 65 C 0 65 -42 45 -42 15 L -42 -35 Z" fill="url(#shield-grad)" stroke="#34d399" stroke-width="2.5" filter="drop-shadow(0px 8px 24px rgba(16,185,129,0.5))" />
    
    <!-- Inner Checkmark -->
    <path d="M -16 5 L -4 17 L 20 -8" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Gold Star of Excellence -->
    <polygon points="0,-72 5,-58 19,-58 8,-49 12,-35 0,-44 -12,-35 -8,-49 -19,-58 -5,-58" fill="url(#gold-grad)" />
  </g>

  <!-- Typography -->
  <text x="400" y="345" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="1">
    FUNDAMENTOS DE INSTALACIÓN
  </text>
  <text x="400" y="375" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">
    ESTÁNDAR DE ORO TEC360 • SEGURIDAD VEHICULAR
  </text>
</svg>
