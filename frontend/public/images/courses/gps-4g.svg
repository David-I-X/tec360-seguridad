<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gps-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a1a" />
      <stop offset="50%" stop-color="#171233" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="gps-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <radialGradient id="purple-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <pattern id="gps-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2e1065" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#gps-bg)" />
  <rect width="800" height="450" fill="url(#gps-grid)" opacity="0.7" />
  <circle cx="400" cy="210" r="190" fill="url(#purple-glow)" />

  <!-- Radar Rings -->
  <g stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <circle cx="400" cy="200" r="60" />
    <circle cx="400" cy="200" r="100" stroke-dasharray="4 6" />
    <circle cx="400" cy="200" r="140" />
  </g>

  <!-- Satellite & Radio Wave Graphic -->
  <g transform="translate(400, 200)">
    <!-- Central Device Box -->
    <rect x="-42" y="-30" width="84" height="60" rx="12" fill="#1e1b4b" stroke="#c084fc" stroke-width="2.5" filter="drop-shadow(0px 8px 24px rgba(168,85,247,0.5))" />
    
    <!-- Status LED and SIM slot -->
    <circle cx="-25" cy="-14" r="3.5" fill="#22c55e" />
    <circle cx="-14" cy="-14" r="3.5" fill="#3b82f6" />
    <circle cx="-3" cy="-14" r="3.5" fill="#eab308" />

    <!-- 4G LTE Text on Device -->
    <text x="12" y="-10" fill="#c084fc" font-family="monospace" font-size="11" font-weight="900" letter-spacing="1">4G LTE</text>

    <!-- Relay Cut-off Switch Icon -->
    <g transform="translate(0, 10)" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M -20 0 L -8 0" />
      <path d="M -8 0 L 6 -10" />
      <path d="M 8 0 L 20 0" />
      <circle cx="-8" cy="0" r="2.5" fill="#f43f5e" />
      <circle cx="8" cy="0" r="2.5" fill="#f43f5e" />
    </g>

    <!-- Radio Waves Emitting -->
    <path d="M -60 -40 A 70 70 0 0 1 -40 -60" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    <path d="M 40 -60 A 70 70 0 0 1 60 -40" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    <path d="M -75 -50 A 90 90 0 0 1 -50 -75" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" />
    <path d="M 50 -75 A 90 90 0 0 1 75 -50" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" />
  </g>

  <!-- Typography -->
  <text x="400" y="345" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="1">
    GPS 4G Y CORTE DE CORRIENTE
  </text>
  <text x="400" y="375" text-anchor="middle" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">
    TELEMETRÍA SATELITAL • RELÉ DE IGNICIÓN
  </text>
</svg>
