<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Shield -->
  <path d="M256 72 L400 140 L400 280 Q400 380 256 440 Q112 380 112 280 L112 140 Z" 
        fill="url(#shield)" opacity="0.15" stroke="url(#shield)" stroke-width="4"/>
  <!-- Inner shield -->
  <path d="M256 110 L370 165 L370 275 Q370 355 256 405 Q142 355 142 275 L142 165 Z" 
        fill="none" stroke="url(#shield)" stroke-width="3" opacity="0.6"/>
  <!-- Circuit lines -->
  <g stroke="#06b6d4" stroke-width="3" fill="none" opacity="0.8">
    <line x1="256" y1="180" x2="256" y2="340"/>
    <line x1="200" y1="230" x2="312" y2="230"/>
    <line x1="200" y1="290" x2="312" y2="290"/>
    <circle cx="256" cy="230" r="8" fill="#06b6d4"/>
    <circle cx="256" cy="290" r="8" fill="#06b6d4"/>
    <circle cx="200" cy="230" r="5" fill="#06b6d4"/>
    <circle cx="312" cy="230" r="5" fill="#06b6d4"/>
    <circle cx="200" cy="290" r="5" fill="#06b6d4"/>
    <circle cx="312" cy="290" r="5" fill="#06b6d4"/>
  </g>
  <!-- T360 text -->
  <text x="256" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="#e2e8f0" letter-spacing="2">T360</text>
</svg>
