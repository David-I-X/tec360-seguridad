# ==============================================================================
# Traccar GPS Server — Docker Compose para Instancia Perla (OCI Subred Privada)
# ==============================================================================

services:
  # --- Base de Datos para Traccar (PostgreSQL) ---
  traccar_db:
    image: postgres:15-alpine
    container_name: traccar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TRACCAR_DB_USER:-traccar}
      POSTGRES_PASSWORD: ${TRACCAR_DB_PASSWORD:-traccar_secret_pass_2026}
      POSTGRES_DB: ${TRACCAR_DB_NAME:-traccar}
    volumes:
      - traccar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRACCAR_DB_USER:-traccar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traccar_net

  # --- Servidor Traccar ---
  traccar:
    image: traccar/traccar:latest
    container_name: traccar_server
    restart: unless-stopped
    depends_on:
      traccar_db:
        condition: service_healthy
    volumes:
      - ./traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar_logs:/opt/traccar/logs
    ports:
      # Puerto Web / API REST de Traccar (accesible desde Rose Diamond 10.0.0.180)
      - "8082:8082"
      # Puertos comunes para protocolos GPS de hardware (TCP / UDP)
      - "5000-5150:5000-5150"
      - "5000-5150:5000-5150/udp"
    networks:
      - traccar_net

volumes:
  traccar_db_data:
  traccar_logs:

networks:
  traccar_net:
    driver: bridge
