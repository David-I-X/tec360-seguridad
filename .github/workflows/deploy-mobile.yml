name: Mobile EAS CI/CD

on:
  push:
    tags:
      - 'v*-mobile'  # Trigger full APK build e.g. v1.0.0-mobile
  workflow_dispatch:
    inputs:
      type:
        description: 'Tipo de Despliegue'
        required: true
        type: choice
        options:
          - 'update'   # Solo Over The Air (rápido, no cambia el APK)
          - 'build'    # Hacer un nuevo APK (requerido si instalas librerías nuevas)
        default: 'update'
      message:
        description: 'Mensaje para este OTA Update (solo requerido para update)'
        required: false
        type: string
        default: 'Actualización automática'

jobs:
  mobile-ci:
    name: Mobile EAS CI/CD
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 🏗 Setup EAS CLI
        run: npm install -g eas-cli

      - name: 📦 Install dependencies
        working-directory: ./mobile
        run: npm ci

      # --- OTA UPDATE MODE ---
      - name: 🚀 Publish OTA Update
        if: github.event.inputs.type == 'update'
        working-directory: ./mobile
        run: eas update --auto --message "${{ github.event.inputs.message }}"
        
      # --- FULL BUILD MODE ---
      - name: 🏗 Build APK (espera a que termine)
        id: build
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.type == 'build'
        working-directory: ./mobile
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || 'AIzaSyCu1NMEsMIIiY1LoOKlzrSovS-r4jTWWFY' }}
        run: |
          set -o pipefail
          echo "🔨 Iniciando build en EAS (esto toma ~25-30 min)..."
          eas build --platform android --profile preview --non-interactive 2>&1 | tee build_output.txt
          echo "✅ Build completado"

      - name: 📥 Descargar APK de EAS
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.type == 'build'
        working-directory: ./mobile
        run: |
          echo "📋 Obteniendo info del último build..."
          BUILD_JSON=$(eas build:list --platform android --status finished --limit 1 --json --non-interactive)
          
          BUILD_URL=$(echo "$BUILD_JSON" | jq -r 'if type=="array" then .[0].artifacts.buildUrl else (.builds[0].artifacts.buildUrl // .[0].artifacts.buildUrl) end')
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r 'if type=="array" then .[0].id else (.builds[0].id // .[0].id) end')
          BUILD_APP_VERSION=$(echo "$BUILD_JSON" | jq -r 'if type=="array" then (.[0].appVersion // "unknown") else ((.builds[0].appVersion // .[0].appVersion) // "unknown") end')
          BUILD_SDK_VERSION=$(echo "$BUILD_JSON" | jq -r 'if type=="array" then (.[0].sdkVersion // "unknown") else ((.builds[0].sdkVersion // .[0].sdkVersion) // "unknown") end')
          BUILD_CREATED=$(echo "$BUILD_JSON" | jq -r 'if type=="array" then (.[0].createdAt // "unknown") else ((.builds[0].createdAt // .[0].createdAt) // "unknown") end')
          
          echo "══════════════════════════════════════════"
          echo "📦 EAS Build Info:"
          echo "   Build ID:     $BUILD_ID"
          echo "   App Version:  $BUILD_APP_VERSION"
          echo "   SDK Version:  $BUILD_SDK_VERSION"
          echo "   Created:      $BUILD_CREATED"
          echo "   Artifact URL: $BUILD_URL"
          echo "══════════════════════════════════════════"
          
          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "❌ No se pudo obtener la URL del build"
            exit 1
          fi
          
          echo "⬇️ Descargando APK..."
          mkdir -p ../frontend/public/app
          curl -L -o ../frontend/public/app/tec360-seguridad-latest.apk "$BUILD_URL"
          
          FILE_SIZE=$(stat -c%s "../frontend/public/app/tec360-seguridad-latest.apk" 2>/dev/null || echo "0")
          FILE_MD5=$(md5sum "../frontend/public/app/tec360-seguridad-latest.apk" | cut -d' ' -f1)
          
          echo "══════════════════════════════════════════"
          echo "📦 APK descargado:"
          echo "   Tamaño: ${FILE_SIZE} bytes ($(( FILE_SIZE / 1048576 )) MB)"
          echo "   MD5:    $FILE_MD5"
          echo "══════════════════════════════════════════"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "⚠️ El archivo es muy pequeño, posible error de descarga"
            exit 1
          fi
          
          # Generate version.json for traceability
          COMMIT_SHA="${{ github.sha }}"
          TAG_NAME="${{ github.ref_name }}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          cat > ../frontend/public/app/version.json << VERSIONEOF
          {
            "tag": "${TAG_NAME}",
            "commit": "${COMMIT_SHA:0:7}",
            "commitFull": "${COMMIT_SHA}",
            "buildDate": "${BUILD_DATE}",
            "easBuildId": "${BUILD_ID}",
            "easAppVersion": "${BUILD_APP_VERSION}",
            "easCreatedAt": "${BUILD_CREATED}",
            "apkSizeBytes": ${FILE_SIZE},
            "apkSizeMB": "$(( FILE_SIZE / 1048576 )) MB",
            "apkMd5": "${FILE_MD5}"
          }
          VERSIONEOF
          
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' ../frontend/public/app/version.json
          
          echo "📄 version.json generado:"
          cat ../frontend/public/app/version.json
          
          echo "✅ APK y version.json listos para subir"

      - name: 📦 Subir APK como artefacto de GitHub Actions
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.type == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: tec360-seguridad-apk
          path: frontend/public/app/tec360-seguridad-latest.apk
          retention-days: 14

      - name: 📤 Subir versión y APK al repositorio
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.type == 'build'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Save files to temp before switching branches
          cp frontend/public/app/tec360-seguridad-latest.apk /tmp/tec360-seguridad-latest.apk
          cp frontend/public/app/version.json /tmp/version.json
          
          # Discard all local changes so we can switch branches cleanly
          git checkout -- .
          
          # Fetch and checkout the latest master branch
          git fetch origin master
          git checkout master
          git pull origin master --ff-only || git reset --hard origin/master
          
          echo "📍 Master está en: $(git log --oneline -1)"
          
          # Copy files back and commit
          mkdir -p frontend/public/app
          cp /tmp/tec360-seguridad-latest.apk frontend/public/app/tec360-seguridad-latest.apk
          cp /tmp/version.json frontend/public/app/version.json
          
          # Verify files are in place
          APK_SIZE=$(stat -c%s "frontend/public/app/tec360-seguridad-latest.apk" 2>/dev/null || echo "0")
          echo "📦 APK en repo: ${APK_SIZE} bytes"
          echo "📄 version.json en repo:"
          cat frontend/public/app/version.json
          
          git add frontend/public/app/version.json
          if [ -f "frontend/public/app/tec360-seguridad-latest.apk" ] && [ "$APK_SIZE" -lt 95000000 ]; then
            git add frontend/public/app/tec360-seguridad-latest.apk
          fi
          git commit -m "🤖 Auto-update APK from EAS build ${{ github.ref_name || 'manual' }}" || echo "No changes to commit"
          
          echo "📍 Nuevo commit: $(git log --oneline -1)"
          
          # Push with retry
          for i in 1 2 3; do
            git push origin master && break
            echo "⚠️ Push failed, retrying ($i/3)..."
            git pull --rebase origin master || git rebase --skip
            sleep 5
          done
          
          echo "✅ APK y version.json subidos al repositorio"

      - name: 📤 Copiar APK al servidor (SCP directo)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.type == 'build'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "frontend/public/app/tec360-seguridad-latest.apk,frontend/public/app/version.json"
          target: "/opt/tec360-seguridad/"
          overwrite: true

      - name: ✅ Verificar APK en el servidor
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.type == 'build'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "🔍 Verificando APK en el servidor..."
            
            APK_PATH="/opt/tec360-seguridad/frontend/public/app/tec360-seguridad-latest.apk"
            VERSION_PATH="/opt/tec360-seguridad/frontend/public/app/version.json"
            
            if [ ! -f "$APK_PATH" ]; then
              echo "❌ ERROR: APK no encontrado en $APK_PATH"
              exit 1
            fi
            
            APK_SIZE=$(stat -c%s "$APK_PATH")
            APK_MD5=$(md5sum "$APK_PATH" | cut -d' ' -f1)
            
            echo "══════════════════════════════════════════"
            echo "📦 APK en servidor:"
            echo "   Tamaño: ${APK_SIZE} bytes ($(( APK_SIZE / 1048576 )) MB)"
            echo "   MD5:    ${APK_MD5}"
            echo "══════════════════════════════════════════"
            
            if [ -f "$VERSION_PATH" ]; then
              echo "📄 version.json:"
              cat "$VERSION_PATH"
              echo ""
            else
              echo "⚠️ version.json no encontrado"
            fi
            
            if [ "$APK_SIZE" -lt 1000000 ]; then
              echo "❌ ERROR: APK demasiado pequeño, posible archivo corrupto"
              exit 1
            fi
            
            echo "✅ APK verificado correctamente en el servidor"

