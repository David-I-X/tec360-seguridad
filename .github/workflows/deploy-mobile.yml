name: Mobile EAS CI/CD

on:
  push:
    tags:
      - 'v*-mobile'  # Trigger full APK build e.g. v1.0.0-mobile
  workflow_dispatch:
    inputs:
      type:
        description: 'Tipo de Despliegue'
        required: true
        type: choice
        options:
          - 'update'   # Solo Over The Air (rápido, no cambia el APK)
          - 'build'    # Hacer un nuevo APK (requerido si instalas librerías nuevas)
        default: 'update'
      message:
        description: 'Mensaje para este OTA Update (solo requerido para update)'
        required: false
        type: string
        default: 'Actualización automática'

jobs:
  mobile-ci:
    name: Mobile EAS CI/CD
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        working-directory: ./mobile
        run: npm ci

      # --- OTA UPDATE MODE ---
      - name: 🚀 Publish OTA Update
        if: github.event.inputs.type == 'update'
        working-directory: ./mobile
        run: eas update --auto --message "${{ github.event.inputs.message }}"
        
      # --- FULL BUILD MODE ---
      - name: 🏗 Build APK (espera a que termine)
        id: build
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.type == 'build'
        working-directory: ./mobile
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          echo "🔨 Iniciando build en EAS (esto toma ~25-30 min)..."
          eas build --platform android --profile preview --non-interactive 2>&1 | tee build_output.txt
          echo "✅ Build completado"

      - name: 📥 Descargar APK de EAS
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.type == 'build'
        working-directory: ./mobile
        run: |
          echo "📋 Obteniendo URL del último build..."
          BUILD_URL=$(eas build:list --platform android --status finished --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl')
          
          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "❌ No se pudo obtener la URL del build"
            exit 1
          fi
          
          echo "⬇️ Descargando APK desde: $BUILD_URL"
          mkdir -p ../frontend/public/app
          curl -L -o ../frontend/public/app/tec360-seguridad-latest.apk "$BUILD_URL"
          
          FILE_SIZE=$(stat -c%s "../frontend/public/app/tec360-seguridad-latest.apk" 2>/dev/null || echo "0")
          echo "📦 APK descargado: ${FILE_SIZE} bytes"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "⚠️ El archivo es muy pequeño, posible error de descarga"
            exit 1
          fi
          
          echo "✅ APK listo para subir al repositorio"

      - name: 📤 Subir APK al repositorio
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.type == 'build'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Save the APK to a temp location before switching branches
          cp frontend/public/app/tec360-seguridad-latest.apk /tmp/tec360-seguridad-latest.apk
          
          # Fetch and checkout the latest master branch
          git fetch origin master
          git checkout master
          git pull origin master --ff-only || git reset --hard origin/master
          
          # Copy APK back and commit
          mkdir -p frontend/public/app
          cp /tmp/tec360-seguridad-latest.apk frontend/public/app/tec360-seguridad-latest.apk
          
          git add frontend/public/app/tec360-seguridad-latest.apk
          git commit -m "🤖 Auto-update APK from EAS build ${{ github.ref_name || 'manual' }}" || echo "No changes to commit"
          
          # Push with retry (in case of race condition with another workflow)
          for i in 1 2 3; do
            git push origin master && break
            echo "⚠️ Push failed, retrying ($i/3)..."
            git pull --rebase origin master || git rebase --skip
            sleep 5
          done
          
          echo "✅ APK actualizado en el repositorio"
          echo "🌐 Disponible en: https://tec-360.tech/descargar-app"

      - name: 🚀 Update Server with new APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.type == 'build'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "📥 Descargando nuevo APK al servidor..."
            cd /opt/tec360-seguridad
            git pull origin master --ff-only || true
            echo "✅ El APK ya está disponible en el Next.js server por el nuevo volumen."
