# ============================================
# CI Pipeline — Lint, Test, Build
# ============================================
# Runs on: push to main, all PRs
# ============================================

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  SKIP_CONFIG_VALIDATION: "true"

jobs:
  # --- Backend ---
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.7.4"
      - run: ruff check app/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tec360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/tec360_test
      SECRET_KEY: test-secret-key
      ENVIRONMENT: test
      SKIP_CONFIG_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enable PostGIS extension
        run: PGPASSWORD=test psql -h localhost -U test -d tec360_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  backend-build:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tec360-backend ./backend

  # --- Frontend ---
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src/

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: http://localhost:3000
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  frontend-build:
    name: Frontend Docker Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-e2e]
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=placeholder \
            -t tec360-frontend ./frontend
