# ============================================
# Deploy Pipeline — Build & Push to Server
# ============================================
# Runs on: push of version tags (v*)
# ============================================

name: Deploy

on:
  push:
    branches:
      - master
    tags:
      - "v*"
      - "!v*-mobile"  # Mobile builds have their own workflow
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag o versión a desplegar (ej. v1.0.1 o latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image prefix
        id: lowercase
        run: echo "image_prefix=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version || 'latest' }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_prefix }}/backend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_prefix }}/backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || '/api' }}
            NEXT_PUBLIC_GOOGLE_MAPS_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY || secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || 'AIzaSyCu1NMEsMIIiY1LoOKlzrSovS-r4jTWWFY' }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_prefix }}/frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_prefix }}/frontend:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd /opt/tec360-seguridad

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            echo "📌 Commit previo antes del despliegue: ${PREV_COMMIT:-ninguno}"

            # Procedimiento de rollback automático en caso de fallo
            rollback() {
              local exit_code=$?
              trap - ERR
              echo "🚨 ERROR: Fallo en el despliegue (código de salida: $exit_code)."
              if [ -n "$PREV_COMMIT" ]; then
                echo "🔄 Ejecutando rollback al commit previo ($PREV_COMMIT)..."
                git reset --hard "$PREV_COMMIT" || true
                echo "🔄 Levantando servicios anteriores estables..."
                docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans backend frontend nginx || true
              fi
              exit 1
            }
            trap rollback ERR

            # 1. Login to GHCR to pull private/new images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            # 2. Sync latest code and compose configuration
            git fetch origin master
            git reset --hard origin/master

            # 3. Seguro de descarga atómica e integridad del APK
            mkdir -p frontend/public/app
            APK_FILE="frontend/public/app/tec360-seguridad-latest.apk"
            APK_TMP="frontend/public/app/tec360-seguridad-latest.apk.tmp"
            APK_BAK="frontend/public/app/tec360-seguridad-previous.apk"

            if [ -f "frontend/public/app/version.json" ]; then
              EXPECTED_SIZE=$(grep -o '"apkSizeBytes": *[0-9]*' frontend/public/app/version.json 2>/dev/null | tr -dc '0-9' || echo "")
              DOWNLOAD_URL=$(grep -o '"downloadUrl": *"[^"]*"' frontend/public/app/version.json 2>/dev/null | cut -d'"' -f4 || echo "")
              ACTUAL_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || echo "0")

              if [ -n "$DOWNLOAD_URL" ] && [ -n "$EXPECTED_SIZE" ] && [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
                echo "⬇️ Sincronizando nuevo APK ($EXPECTED_SIZE bytes) desde EAS..."
                if curl -sSfL -o "$APK_TMP" "$DOWNLOAD_URL"; then
                  DOWNLOADED_SIZE=$(stat -c%s "$APK_TMP" 2>/dev/null || echo "0")
                  if [ "$DOWNLOADED_SIZE" = "$EXPECTED_SIZE" ]; then
                    [ -f "$APK_FILE" ] && cp -f "$APK_FILE" "$APK_BAK" || true
                    mv -f "$APK_TMP" "$APK_FILE"
                    echo "✅ APK verificado y sincronizado: $DOWNLOADED_SIZE bytes"
                  else
                    echo "⚠️ Tamaño descargado ($DOWNLOADED_SIZE bytes) no coincide con esperado ($EXPECTED_SIZE bytes). Descartando temporal."
                    rm -f "$APK_TMP"
                  fi
                else
                  echo "⚠️ No se pudo descargar el APK desde EAS CDN. Se mantiene el archivo actual sin interrumpir el despliegue."
                  rm -f "$APK_TMP"
                fi
              else
                echo "ℹ️ APK ya se encuentra actualizado o sin cambios ($ACTUAL_SIZE bytes)."
              fi
            fi

            # 4. Snapshot preventivo de la base de datos antes de migrar
            mkdir -p backups
            echo "💾 Creando snapshot preventivo de base de datos..."
            DB_U=$(grep '^DB_USER=' .env.production 2>/dev/null | cut -d'=' -f2- | tr -d '\r"' || echo "tec360")
            DB_N=$(grep '^DB_NAME=' .env.production 2>/dev/null | cut -d'=' -f2- | tr -d '\r"' || echo "tec360")
            BACKUP_FILE="backups/pre_deploy_$(date +%Y%m%d_%H%M%S).sql.gz"
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T db pg_dump -U "${DB_U:-tec360}" "${DB_N:-tec360}" 2>/dev/null | gzip > "$BACKUP_FILE" || echo "⚠️ Advertencia: No se pudo generar snapshot (db no accesible aún)."
            if [ -s "$BACKUP_FILE" ]; then
              echo "✅ Snapshot de base de datos generado: $BACKUP_FILE ($(stat -c%s "$BACKUP_FILE") bytes)"
              ls -tp backups/pre_deploy_*.sql.gz 2>/dev/null | tail -n +6 | xargs -I {} rm -- {} 2>/dev/null || true
            else
              rm -f "$BACKUP_FILE"
            fi

            # 5. Pull fresh images from GHCR (fallback to local build if pull fails)
            echo "🐳 Actualizando imágenes de contenedores..."
            docker compose -f docker-compose.prod.yml --env-file .env.production pull backend frontend || docker compose -f docker-compose.prod.yml --env-file .env.production build backend frontend

            # 6. Run database migrations before starting the app
            echo "🔄 Ejecutando migraciones de base de datos..."
            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm backend alembic upgrade head

            # 7. Restart containers with latest images
            echo "🚀 Levantando servicios actualizados..."
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans backend frontend nginx
            docker compose -f docker-compose.prod.yml --env-file .env.production restart nginx

            # 8. Seguro de Verificación de Salud (Health Check)
            echo "🩺 Verificando salud de los servicios..."
            HEALTHY=false
            for i in $(seq 1 15); do
              HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://127.0.0.1/api/health 2>/dev/null || curl -s -o /dev/null -w "%{http_code}" -L http://127.0.0.1/api/health 2>/dev/null || echo "000")
              if [ "$HTTP_STATUS" = "200" ]; then
                HEALTHY=true
                echo "✅ Backend y Base de Datos respondiendo correctamente (HTTP 200)."
                break
              fi
              echo "⏳ Esperando inicialización (intento $i/15 - status: $HTTP_STATUS)..."
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "🚨 Health check fallido: Los servicios no respondieron HTTP 200 tras 30 segundos!"
              rollback
            fi

            # 9. Cleanup dangling images sólo tras verificación exitosa
            docker image prune -f
            echo "✅ Despliegue y verificación completados exitosamente para ${{ steps.meta.outputs.version || github.ref_name }}"
