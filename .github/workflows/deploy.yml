# ============================================
# Deploy Pipeline — Build & Push to Server
# ============================================
# Runs on: push of version tags (v*)
# ============================================

name: Deploy

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image prefix
        id: lowercase
        run: echo "image_prefix=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_prefix }}/backend:${{ steps.meta.outputs.version }} \
                        -t ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_prefix }}/backend:latest \
                        ./backend
          docker push ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_prefix }}/backend:${{ steps.meta.outputs.version }}
          docker push ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_prefix }}/backend:latest

      - name: Build & push frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }} \
            -t ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_prefix }}/frontend:${{ steps.meta.outputs.version }} \
            -t ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_prefix }}/frontend:latest \
            ./frontend
          docker push ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_prefix }}/frontend:${{ steps.meta.outputs.version }}
          docker push ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_prefix }}/frontend:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Login to GHCR to pull private/new images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            # Sync latest compose file from repo
            cd /opt/tec360-seguridad
            git pull origin master --ff-only || true

            # Pull fresh images from GHCR and restart
            docker compose -f docker-compose.prod.yml --env-file .env.production pull backend frontend
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-deps backend frontend

            # Cleanup dangling images
            docker image prune -f
            echo "✅ Deployed version ${{ github.ref_name }}"
